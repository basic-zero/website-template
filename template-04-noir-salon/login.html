<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Đăng Nhập - Noir Salon</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={theme:{extend:{colors:{navy:'#1B2A4A','navy-dark':'#0D1829',gold:'#C9A84C',ivory:'#FAFAF7'}}}}</script>
</head>
<body class="bg-navy-dark min-h-screen flex flex-col font-sans">
<nav class="bg-navy border-b border-gold/20 py-4 px-6 flex items-center justify-between">
  <a href="index.html" class="flex items-center gap-2"><span class="text-2xl">✂️</span><span class="font-bold text-xl text-ivory">Noir<span class="text-gold">Salon</span></span></a>
  <a href="index.html" class="text-gold text-sm hover:text-yellow-400">← Trang Chủ</a>
</nav>
<div class="flex-1 flex items-center justify-center px-4 py-12">
  <div class="w-full max-w-md">
    <div class="text-center mb-8"><span class="text-5xl">✂️</span><h1 class="text-2xl font-bold text-ivory mt-3">Chào Mừng Trở Lại</h1><p class="text-gray-400 text-sm mt-1">Đăng nhập để quản lý lịch hẹn & đơn hàng</p></div>
    <div class="flex rounded-xl overflow-hidden border border-gold/30 mb-8">
      <button id="tab-login" onclick="switchTab('login')" class="flex-1 py-3 text-sm font-semibold bg-gold text-navy-dark">Đăng Nhập</button>
      <button id="tab-reg" onclick="switchTab('reg')" class="flex-1 py-3 text-sm font-semibold text-gray-400 hover:text-gold transition">Đăng Ký</button>
    </div>
    <div id="form-login" class="bg-navy rounded-xl p-8 shadow-sm space-y-4 border border-gold/20">
      <div><label class="text-gold text-xs font-semibold uppercase tracking-wide block mb-2">Email *</label><input type="email" placeholder="email@example.com" class="w-full bg-navy-dark border border-gold/30 focus:border-gold rounded-lg px-4 py-3 text-sm outline-none text-ivory"/></div>
      <div><label class="text-gold text-xs font-semibold uppercase tracking-wide block mb-2">Mật Khẩu *</label><input type="password" placeholder="••••••••" class="w-full bg-navy-dark border border-gold/30 focus:border-gold rounded-lg px-4 py-3 text-sm outline-none text-ivory"/></div>
      <div class="flex justify-between items-center"><label class="flex items-center gap-2 text-sm text-gray-400 cursor-pointer"><input type="checkbox" class="accent-gold"/>Ghi nhớ</label><a href="#" class="text-gold text-xs hover:text-yellow-400">Quên mật khẩu?</a></div>
      <a href="profile.html" class="block w-full bg-gold text-navy-dark py-3 rounded-lg font-bold text-center hover:bg-yellow-500 transition">Đăng Nhập</a>
      <div class="relative"><div class="absolute inset-0 flex items-center"><div class="w-full border-t border-gold/20"></div></div><div class="relative flex justify-center"><span class="bg-navy px-3 text-gray-500 text-xs">hoặc</span></div></div>
      <div class="grid grid-cols-2 gap-3">
        <button class="border border-gold/20 rounded-lg py-2.5 text-sm text-gray-400 hover:border-gold transition flex items-center justify-center gap-2">🔵 Google</button>
        <button class="border border-gold/20 rounded-lg py-2.5 text-sm text-gray-400 hover:border-gold transition flex items-center justify-center gap-2">🔷 Facebook</button>
      </div>
    </div>
    <div id="form-reg" class="hidden bg-navy rounded-xl p-8 shadow-sm space-y-4 border border-gold/20">
      <div class="grid grid-cols-2 gap-3">
        <div><label class="text-gold text-xs font-semibold uppercase tracking-wide block mb-2">Họ *</label><input type="text" placeholder="Trần" class="w-full bg-navy-dark border border-gold/30 focus:border-gold rounded-lg px-4 py-3 text-sm outline-none text-ivory"/></div>
        <div><label class="text-gold text-xs font-semibold uppercase tracking-wide block mb-2">Tên *</label><input type="text" placeholder="Minh Khoa" class="w-full bg-navy-dark border border-gold/30 focus:border-gold rounded-lg px-4 py-3 text-sm outline-none text-ivory"/></div>
      </div>
      <div><label class="text-gold text-xs font-semibold uppercase tracking-wide block mb-2">Email *</label><input type="email" placeholder="email@example.com" class="w-full bg-navy-dark border border-gold/30 focus:border-gold rounded-lg px-4 py-3 text-sm outline-none text-ivory"/></div>
      <div><label class="text-gold text-xs font-semibold uppercase tracking-wide block mb-2">Số Điện Thoại</label><input type="tel" placeholder="0934 567 890" class="w-full bg-navy-dark border border-gold/30 focus:border-gold rounded-lg px-4 py-3 text-sm outline-none text-ivory"/></div>
      <div><label class="text-gold text-xs font-semibold uppercase tracking-wide block mb-2">Mật Khẩu *</label><input type="password" placeholder="Tối thiểu 8 ký tự" class="w-full bg-navy-dark border border-gold/30 focus:border-gold rounded-lg px-4 py-3 text-sm outline-none text-ivory"/></div>
      <label class="flex items-start gap-2 cursor-pointer"><input type="checkbox" class="accent-gold mt-1"/><span class="text-xs text-gray-400">Tôi đồng ý với <a href="#" class="text-gold">Điều khoản</a> và muốn nhận ưu đãi từ Noir Salon</span></label>
      <a href="profile.html" class="block w-full bg-gold text-navy-dark py-3 rounded-lg font-bold text-center hover:bg-yellow-500 transition">Tạo Tài Khoản ✂️</a>
    </div>
    <div class="mt-8 bg-navy rounded-xl p-5 border border-gold/20">
      <p class="text-gold text-xs font-semibold uppercase tracking-wide mb-3">Đặc Quyền Thành Viên</p>
      <div class="grid grid-cols-2 gap-2 text-xs text-gray-400">
        <div>✂️ Đặt lịch ưu tiên</div><div>🎁 Quà sinh nhật VIP</div>
        <div>💰 Giảm 10% lần đầu</div><div>📱 Nhắc lịch tự động</div>
      </div>
    </div>
  </div>
</div>
<script>
function switchTab(t){
  document.getElementById('form-login').classList.toggle('hidden',t!=='login');
  document.getElementById('form-reg').classList.toggle('hidden',t!=='reg');
  document.getElementById('tab-login').className=t==='login'?'flex-1 py-3 text-sm font-semibold bg-gold text-navy-dark':'flex-1 py-3 text-sm font-semibold text-gray-400';
  document.getElementById('tab-reg').className=t==='reg'?'flex-1 py-3 text-sm font-semibold bg-gold text-navy-dark':'flex-1 py-3 text-sm font-semibold text-gray-400';
}
</script>
</body>
</html>
