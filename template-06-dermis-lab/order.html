<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Đặt Hàng - Dermis Lab</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={theme:{extend:{colors:{clinic:'#003580',teal:'#00A896','clinic-dark':'#002060'}}}}</script>
</head>
<body class="bg-gray-50 font-sans">
<nav class="fixed top-0 left-0 right-0 z-50 bg-white border-b border-clinic/10 shadow-sm">
  <div class="max-w-7xl mx-auto px-4 flex items-center justify-between h-16">
    <a href="index.html" class="flex items-center gap-2"><span class="text-2xl">🔬</span><span class="font-bold text-xl text-clinic">Dermis<span class="text-teal">Lab</span></span></a>
    <a href="cart.html" class="text-clinic text-sm">← Giỏ Hàng</a>
  </div>
</nav>
<div class="max-w-6xl mx-auto px-4 pt-24 pb-20">
  <div class="flex items-center gap-2 text-xs text-gray-400 mb-8">
    <span class="text-teal font-bold">✓ Giỏ hàng</span><span>›</span><span class="font-bold text-clinic">2. Đặt hàng</span><span>›</span><span>3. Thanh toán</span>
  </div>
  <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
    <div class="lg:col-span-2 space-y-6">
      <div class="bg-white rounded-xl p-6 shadow-sm border border-gray-100">
        <h2 class="font-bold text-clinic mb-5">Thông Tin Giao Hàng</h2>
        <div class="space-y-4">
          <div class="grid grid-cols-2 gap-4">
            <div><label class="text-teal text-xs font-semibold uppercase block mb-1">Họ</label><input type="text" placeholder="Nguyễn" class="w-full bg-gray-50 border border-clinic/20 focus:border-clinic rounded-lg px-4 py-2.5 text-sm outline-none"/></div>
            <div><label class="text-teal text-xs font-semibold uppercase block mb-1">Tên</label><input type="text" placeholder="Văn An" class="w-full bg-gray-50 border border-clinic/20 focus:border-clinic rounded-lg px-4 py-2.5 text-sm outline-none"/></div>
          </div>
          <div><label class="text-teal text-xs font-semibold uppercase block mb-1">Email</label><input type="email" placeholder="vanan@email.com" class="w-full bg-gray-50 border border-clinic/20 focus:border-clinic rounded-lg px-4 py-2.5 text-sm outline-none"/></div>
          <div><label class="text-teal text-xs font-semibold uppercase block mb-1">Số Điện Thoại</label><input type="tel" placeholder="0921 234 567" class="w-full bg-gray-50 border border-clinic/20 focus:border-clinic rounded-lg px-4 py-2.5 text-sm outline-none"/></div>
          <div><label class="text-teal text-xs font-semibold uppercase block mb-1">Địa Chỉ</label><input type="text" placeholder="Số nhà, tên đường" class="w-full bg-gray-50 border border-clinic/20 focus:border-clinic rounded-lg px-4 py-2.5 text-sm outline-none"/></div>
          <div class="grid grid-cols-3 gap-3">
            <div><label class="text-teal text-xs font-semibold uppercase block mb-1">Tỉnh/Thành</label><select class="w-full bg-gray-50 border border-clinic/20 rounded-lg px-3 py-2.5 text-sm outline-none"><option>Hà Nội</option><option>TP. HCM</option></select></div>
            <div><label class="text-teal text-xs font-semibold uppercase block mb-1">Quận/Huyện</label><select class="w-full bg-gray-50 border border-clinic/20 rounded-lg px-3 py-2.5 text-sm outline-none"><option>Hoàn Kiếm</option><option>Ba Đình</option></select></div>
            <div><label class="text-teal text-xs font-semibold uppercase block mb-1">Phường/Xã</label><select class="w-full bg-gray-50 border border-clinic/20 rounded-lg px-3 py-2.5 text-sm outline-none"><option>P. Tràng Tiền</option></select></div>
          </div>
        </div>
      </div>
      <div class="bg-white rounded-xl p-6 shadow-sm border border-gray-100">
        <h2 class="font-bold text-clinic mb-4">Phương Thức Vận Chuyển</h2>
        <div class="space-y-3">
          <label class="flex items-center justify-between p-4 border-2 border-clinic rounded-xl cursor-pointer bg-clinic/5">
            <div class="flex items-center gap-3"><input type="radio" name="ship" checked class="accent-clinic"/><div><p class="font-semibold text-sm">Giao Hàng Tiêu Chuẩn</p><p class="text-gray-400 text-xs">2-3 ngày làm việc</p></div></div>
            <span class="text-teal font-bold text-sm">Miễn phí</span>
          </label>
          <label class="flex items-center justify-between p-4 border border-gray-200 rounded-xl cursor-pointer hover:border-clinic/30 transition">
            <div class="flex items-center gap-3"><input type="radio" name="ship" class="accent-clinic"/><div><p class="font-semibold text-sm">Giao Nhanh Express</p><p class="text-gray-400 text-xs">Trong ngày (Hà Nội)</p></div></div>
            <span class="font-bold text-sm">40.000₫</span>
          </label>
        </div>
      </div>
    </div>
    <div class="lg:col-span-1">
      <div class="bg-white rounded-xl p-6 shadow-sm sticky top-24 border border-gray-100">
        <h2 class="font-bold text-clinic mb-4">Đơn Hàng</h2>
        <div class="space-y-3 mb-4">
          <div class="flex items-center gap-3"><div class="w-10 h-10 bg-clinic/5 rounded-lg flex items-center justify-center"><span>🔬</span></div><div class="flex-1 text-xs"><p class="font-semibold">Retinol 0.3%</p><p class="text-gray-400">30ml ×1</p></div><p class="text-clinic font-bold text-sm">680K</p></div>
          <div class="flex items-center gap-3"><div class="w-10 h-10 bg-teal/10 rounded-lg flex items-center justify-center"><span>🍋</span></div><div class="flex-1 text-xs"><p class="font-semibold">Vitamin C 20%</p><p class="text-gray-400">30ml ×1</p></div><p class="text-clinic font-bold text-sm">750K</p></div>
        </div>
        <div class="border-t border-clinic/10 pt-4 space-y-2 text-sm mb-4">
          <div class="flex justify-between"><span class="text-gray-500">Tạm tính</span><span>1.430.000₫</span></div>
          <div class="flex justify-between"><span class="text-gray-500">Vận chuyển</span><span class="text-teal">Miễn phí</span></div>
        </div>
        <div class="border-t border-clinic/10 pt-4 flex justify-between font-bold text-lg mb-5"><span>Tổng</span><span class="text-clinic">1.430.000₫</span></div>
        <a href="payment.html" class="block w-full bg-clinic text-white py-3.5 rounded-xl font-bold text-center hover:bg-clinic-dark transition text-sm">Tiếp Tục →</a>
      </div>
    </div>
  </div>
</div>
<footer class="bg-clinic text-white py-8"><div class="max-w-7xl mx-auto px-4 text-center"><p class="text-teal text-xs">© 2025 Dermis Lab.</p></div></footer>
</body>
</html>
